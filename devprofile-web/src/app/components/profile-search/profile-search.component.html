<div class="app-container" #appContainer>

  <!-- Chuva de contribuições: só aparece quando há um perfil na tela. -->
  <app-contribution-rain *ngIf="contributionDays.length" [days]="contributionDays"></app-contribution-rain>

  <!-- Header — always visible across all states -->
  <app-header
      [isMainView]="!!(profile || comparison)"
      (onHome)="resetView()">
  </app-header>

  <!-- Landing Page — single viewport, no scroll. Remains alive during loading phase now -->
  <div class="hero-landing" *ngIf="!profile && !comparison && !isJsonView">
    <app-hero 
        [error]="error"
        [loading]="loading"
        [status]="loadingStatus"
        (onErrorClear)="error = null"
        (onSearch)="searchProfile($event)"
        (onCompare)="handleCompare($event)">
    </app-hero>
  </div>



  <!-- Main Dashboard -->
  <app-profile-dashboard 
      *ngIf="profile && !loading && !isJsonView" 
      [profile]="profile"
      (onBack)="resetView()"
      (onDownload)="downloadAsImage($event)">
  </app-profile-dashboard>

  <!-- Comparison Dashboard -->
  <app-profile-comparison 
      *ngIf="comparison && !loading && !isJsonView" 
      [comparison]="comparison"
      (onBack)="resetView()"
      (onDownload)="downloadAsImage($event)">
  </app-profile-comparison>

</div>
