<div class="app-container" #appContainer>

  <!-- Aurora animated background -->
  <canvas class="bg-canvas" #bgCanvas aria-hidden="true"></canvas>

  <!-- Header — only on landing page; dashboard has its own sticky topbar -->
  <app-header
      *ngIf="!profile && !comparison && !loading"
      [isMainView]="false"
      (onHome)="resetView()">
  </app-header>

  <!-- Landing Page — single viewport, no scroll -->
  <div class="hero-landing" *ngIf="!profile && !comparison && !loading && !isJsonView">
    <app-hero 
        [error]="error"
        (onSearch)="searchProfile($event)"
        (onCompare)="handleCompare($event)">
    </app-hero>
  </div>

  <!-- Loading Screen Overlay -->
  <app-loading-overlay *ngIf="loading"></app-loading-overlay>

  <!-- Main Dashboard -->
  <app-profile-dashboard 
      *ngIf="profile && !loading && !isJsonView" 
      [profile]="profile"
      (onBack)="resetView()"
      (onDownload)="downloadAsImage($event)">
  </app-profile-dashboard>

  <!-- Comparison Dashboard -->
  <app-profile-comparison 
      *ngIf="comparison && !loading && !isJsonView" 
      [comparison]="comparison"
      (onBack)="resetView()"
      (onDownload)="downloadAsImage($event)">
  </app-profile-comparison>

</div>
