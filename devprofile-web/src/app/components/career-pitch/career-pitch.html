<div class="pitch-card">
  <div class="pitch-header">
    <div class="pitch-tag">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      Pitch Profissional
    </div>
    <button class="btn-copy" (click)="copy()" [class.copied]="copied" title="Copiar para clipboard">
      <svg *ngIf="!copied" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
      <svg *ngIf="copied" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      {{ copied ? 'Copiado!' : 'Copiar' }}
    </button>
  </div>
  <blockquote class="pitch-text">{{ pitch }}</blockquote>
  <div class="pitch-hint">
    Ideal para LinkedIn, currículo ou apresentações profissionais
  </div>
</div>
