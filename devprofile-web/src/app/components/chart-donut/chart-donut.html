<div class="donut-wrap">
  <div class="donut-chart">
    <svg viewBox="0 0 200 200" role="img" [attr.aria-label]="chartLabel()">
      <circle cx="100" cy="100" [attr.r]="r" fill="none" class="donut-track" [attr.stroke-width]="36" />

      <circle *ngFor="let s of slices()"
        cx="100" cy="100"
        [attr.r]="r"
        fill="none"
        [attr.stroke]="s.color"
        stroke-width="34"
        [attr.stroke-dasharray]="s.dashArray"
        [attr.stroke-dashoffset]="s.offset"
        stroke-linecap="butt"
        class="donut-slice"
        (mouseenter)="onHover(s)"
        (mouseleave)="onHover(null)"
        transform="rotate(-90 100 100)" />

      <text x="100" y="96" text-anchor="middle" class="donut-center-title">
        {{ hoveredSlice ? hoveredSlice.label : centerLabel() }}
      </text>
      <text x="100" y="116" text-anchor="middle" class="donut-center-sub">
        {{ hoveredSlice ? (hoveredSlice.value + '%') : 'stack principal' }}
      </text>
    </svg>
  </div>

  <ul class="donut-legend">
    <li class="legend-item"
      *ngFor="let s of slices()"
      (mouseenter)="onHover(s)"
      (mouseleave)="onHover(null)"
      [class.is-active]="hoveredSlice === s">
      <span class="swatch-dot" [style.background]="s.color"></span>
      <span class="legend-label">{{ s.label }}</span>
      <span class="legend-val num">{{ s.value }}%</span>
    </li>
  </ul>
</div>
